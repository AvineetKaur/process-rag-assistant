[project]
name = "process-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Avineet Kaur", email = "avineetkaur15@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ollama>=0.6.3",
    "pypdf>=6.19.0",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
process-rag-assistant = "process_rag_assistant.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
